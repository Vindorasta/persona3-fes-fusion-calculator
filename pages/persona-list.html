<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Persona List - P3F Fusion Tool</title>

    <link rel="stylesheet" href="../assets/css/style.css" />
  </head>

  <body>
    <main class="persona-page">
      <section class="page-header">
        <h1>Persona Database</h1>

        <p>Explore Persona from Persona 3 FES.</p>
      </section>

      <section class="persona-filter">
        <input
          type="text"
          id="persona-search"
          placeholder="Search Persona..."
        />

        <select id="arcana-filter">
          <option value="all">All Arcana</option>
        </select>

        <select id="level-sort">
          <option value="default">Default</option>

          <option value="asc">Level ↑</option>

          <option value="desc">Level ↓</option>
        </select>
      </section>

      <section class="persona-list" id="persona-list">
        <!-- Persona cards akan dibuat oleh JavaScript -->
      </section>
    </main>
    <script src="../assets/js/script.js"></script>
  </body>
</html>
