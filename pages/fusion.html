<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Persona Fusion Calculator</title>

    <link rel="stylesheet" href="../assets/css/style.css" />
  </head>

  <body>
    <main class="fusion-page">
      <h1>Persona Fusion Calculator</h1>

      <div class="fusion-mode">
        <button id="normal-mode">Normal Fusion</button>

        <button id="special-mode">Special Fusion</button>
      </div>

      <section id="normal-fusion">
        <div class="fusion-container">
          <div class="fusion-select">
            <label> Persona A </label>

            <input
              type="text"
              id="search-persona-a"
              placeholder="Search Persona..."
            />

            <div id="persona-options-a" class="persona-options"></div>

            <select id="persona-a" hidden></select>
          </div>

          <div class="fusion-symbol">+</div>

          <div class="fusion-select">
            <label> Persona B </label>

            <input
              type="text"
              id="search-persona-b"
              placeholder="Search Persona..."
            />

            <div id="persona-options-b" class="persona-options"></div>

            <select id="persona-b" hidden></select>
          </div>
        </div>

        <button id="fusion-button" type="button">Calculate Fusion</button>
      </section>

      <section id="special-fusion" style="display: none">
        <h2>Special Fusion</h2>

        <div id="special-materials"></div>

        <button id="special-fusion-button">Calculate Special Fusion</button>
      </section>
      <h2>Fusion Result</h2>

      <div id="fusion-result"></div>
    </main>

    <script src="../assets/js/script.js"></script>
  </body>
</html>
